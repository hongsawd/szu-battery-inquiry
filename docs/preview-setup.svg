<svg xmlns="http://www.w3.org/2000/svg" width="400" height="452" viewBox="0 0 400 452" font-family="Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="399" height="451" rx="10" fill="#2B2B2B" stroke="#FFFFFF" stroke-opacity="0.15" filter="url(#shadow)"/>

  <!-- 头部 -->
  <rect x="18" y="15" width="26" height="26" rx="7" fill="#4CC2FF" fill-opacity="0.15"/>
  <g stroke="#4CC2FF" stroke-width="1.4" fill="none" stroke-linecap="round">
    <circle cx="31" cy="28" r="4"/>
    <circle cx="31" cy="28" r="1.3"/>
    <path d="M31 21.6v1.7M31 32.7v1.7M24.6 28h1.7M35.7 28h1.7M26.5 23.5l1.2 1.2M34.3 31.3l1.2 1.2M35.5 23.5l-1.2 1.2M27.7 31.3l-1.2 1.2"/>
  </g>
  <text x="53" y="27" font-size="13.5" font-weight="600" fill="#FFFFFF">深大电量 · 设置</text>
  <text x="18" y="57" font-size="10.5" fill="#FFFFFF" fill-opacity="0.55">填完保存，之后想改再点卡片上的齿轮</text>

  <!-- 主题 -->
  <text x="18" y="84" font-size="10.5" fill="#FFFFFF" fill-opacity="0.55">主题</text>
  <g>
    <rect x="18" y="91" width="52" height="25.6" rx="12" fill="#4CC2FF" fill-opacity="0.18" stroke="#4CC2FF" stroke-opacity="0.5"/>
    <text x="44" y="108" font-size="11.5" fill="#FFFFFF" text-anchor="middle">深色</text>

    <rect x="76" y="91" width="52" height="25.6" rx="12" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="102" y="108" font-size="11.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">浅色</text>

    <rect x="134" y="91" width="76" height="25.6" rx="12" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="172" y="108" font-size="11.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">跟随系统</text>
  </g>

  <!-- 校区 -->
  <text x="18" y="140" font-size="10.5" fill="#FFFFFF" fill-opacity="0.55">校区</text>
  <g>
    <rect x="18" y="147" width="58" height="25.6" rx="12" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="47" y="164" font-size="11.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">北校区</text>

    <rect x="82" y="147" width="58" height="25.6" rx="12" fill="#4CC2FF" fill-opacity="0.18" stroke="#4CC2FF" stroke-opacity="0.5"/>
    <text x="111" y="164" font-size="11.5" fill="#FFFFFF" text-anchor="middle">南校区</text>

    <rect x="146" y="147" width="70" height="25.6" rx="12" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="181" y="164" font-size="11.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">西丽校区</text>

    <rect x="222" y="147" width="82" height="25.6" rx="12" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="263" y="164" font-size="11.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">深大新斋区</text>
  </g>

  <!-- 楼栋（首次打开：一个都没选） -->
  <text x="18" y="196" font-size="10.5" fill="#FFFFFF" fill-opacity="0.55">楼栋</text>
  <g font-size="11.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">
    <g fill="#FFFFFF" fill-opacity="0.10">
      <rect x="18" y="203" width="86" height="25.6" rx="12"/>
      <rect x="110" y="203" width="92" height="25.6" rx="12"/>
      <rect x="208" y="203" width="86" height="25.6" rx="12"/>
      <rect x="296" y="203" width="86" height="25.6" rx="12"/>
      <rect x="18" y="234.6" width="86" height="25.6" rx="12"/>
      <rect x="110" y="234.6" width="86" height="25.6" rx="12"/>
      <rect x="202" y="234.6" width="92" height="25.6" rx="12"/>
      <rect x="18" y="266.2" width="96" height="25.6" rx="12"/>
      <rect x="120" y="266.2" width="96" height="25.6" rx="12"/>
    </g>
    <text x="61" y="220">春笛3-8楼</text>
    <text x="156" y="220">夏筝3-17楼</text>
    <text x="251" y="220">秋瑟3-8楼</text>
    <text x="339" y="220">冬筑3-6楼</text>
    <text x="61" y="251.6">春笛9-17楼</text>
    <text x="153" y="251.6">秋瑟9-17楼</text>
    <text x="248" y="251.6">冬筑7-10楼</text>
    <text x="66" y="283.2">冬筑11-14楼</text>
    <text x="168" y="283.2">冬筑15-17楼</text>
  </g>

  <!-- 房间号 / 快捷键 -->
  <text x="18" y="316" font-size="10.5" fill="#FFFFFF" fill-opacity="0.55">房间号（三位，如 101）</text>
  <rect x="18" y="323" width="104" height="28" rx="3" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>

  <text x="204" y="316" font-size="10.5" fill="#FFFFFF" fill-opacity="0.55">快捷键（点框按下组合键）</text>
  <rect x="204" y="323" width="146" height="28" rx="3" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="212" y="341" font-size="11.5" fill="#FFFFFF">CTRL + ALT + E</text>
  <rect x="356" y="323" width="26" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <path d="M365 333 L373 341 M373 333 L365 341" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 提示 -->
  <text x="18" y="371" font-size="9.5" fill="#FFFFFF" fill-opacity="0.45">支持 Ctrl / Alt / Shift / Win 任意组合（如 Win+Alt+E）；清空 = 不设热键。热键由</text>
  <text x="18" y="384" font-size="9.5" fill="#FFFFFF" fill-opacity="0.45">常驻小进程接管，托盘图标右键可退出。</text>

  <!-- 按钮 -->
  <rect x="242" y="402" width="66" height="31" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <text x="275" y="422" font-size="12" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">取消</text>

  <rect x="318" y="402" width="64" height="31" rx="6" fill="#4CC2FF"/>
  <text x="350" y="422" font-size="12" font-weight="600" fill="#101010" text-anchor="middle">保存</text>
</svg>

