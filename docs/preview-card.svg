<svg xmlns="http://www.w3.org/2000/svg" width="376" height="250" viewBox="0 0 376 250" font-family="Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 卡片底 -->
  <rect x="0.5" y="0.5" width="375" height="249" rx="9" fill="#2B2B2B" stroke="#FFFFFF" stroke-opacity="0.15" filter="url(#shadow)"/>

  <!-- 头部 -->
  <rect x="15" y="13" width="28" height="28" rx="7" fill="#4CC2FF" fill-opacity="0.15"/>
  <path d="M28.4 19.2 L23.2 28.2 L27.0 28.2 L25.8 34.6 L31.4 25.6 L27.6 25.6 Z" fill="#4CC2FF"/>
  <text x="53" y="25" font-size="13.5" font-weight="600" fill="#FFFFFF">深大电量 · 南区冬筑 101</text>
  <text x="53" y="42" font-size="11" fill="#FFFFFF" fill-opacity="0.55">数据 2026-10-23 · 约还可用 11 天</text>

  <!-- 右上：齿轮 + 关闭 -->
  <rect x="311" y="13" width="22" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.2" fill="none">
    <circle cx="322" cy="24" r="4.2"/>
    <circle cx="322" cy="24" r="1.4"/>
    <path d="M322 17.4v1.8M322 28.8v1.8M315.4 24h1.8M326.8 24h1.8M317.3 19.3l1.3 1.3M325.4 27.4l1.3 1.3M326.7 19.3l-1.3 1.3M318.6 27.4l-1.3 1.3"/>
  </g>
  <rect x="339" y="13" width="22" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <path d="M346 20.5 L353 27.5 M353 20.5 L346 27.5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.3" stroke-linecap="round"/>

  <!-- 三个数 -->
  <text x="17" y="92" font-size="30" font-weight="300" fill="#FFFFFF">88.60</text>
  <text x="102" y="92" font-size="13" fill="#FFFFFF" fill-opacity="0.6">度</text>

  <text x="150" y="72" font-size="10.5" fill="#FFFFFF" fill-opacity="0.48">昨日用电</text>
  <text x="150" y="92" font-size="17" fill="#FFFFFF">7.2</text>
  <text x="178" y="92" font-size="11" fill="#FFFFFF" fill-opacity="0.55">度</text>

  <text x="228" y="72" font-size="10.5" fill="#FFFFFF" fill-opacity="0.48">平均用电</text>
  <text x="228" y="92" font-size="17" fill="#FFFFFF">7.5</text>
  <text x="256" y="92" font-size="11" fill="#FFFFFF" fill-opacity="0.55">度</text>

  <!-- 图表标题 -->
  <text x="17" y="122" font-size="9.5" fill="#FFFFFF" fill-opacity="0.4">近 5 天每日用电（度）</text>

  <!-- 图表 -->
  <g transform="translate(15,132)">
    <!-- 网格 + 左侧刻度 -->
    <line x1="36" y1="24" x2="334" y2="24" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <line x1="36" y1="44" x2="334" y2="44" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <line x1="36" y1="64" x2="334" y2="64" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="18" y="27" font-size="9" fill="#FFFFFF" fill-opacity="0.35" text-anchor="end">12</text>
    <text x="18" y="47" font-size="9" fill="#FFFFFF" fill-opacity="0.35" text-anchor="end">6</text>
    <text x="18" y="67" font-size="9" fill="#FFFFFF" fill-opacity="0.35" text-anchor="end">0</text>

    <!-- 面积 + 折线 -->
    <polygon points="36,32.67 110.5,41.33 185,36.67 259.5,44.33 334,40 334,64 36,64" fill="#4CC2FF" fill-opacity="0.12"/>
    <polyline points="36,32.67 110.5,41.33 185,36.67 259.5,44.33 334,40" fill="none" stroke="#4CC2FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 数据点 -->
    <g fill="#1E1E1E" stroke="#4CC2FF" stroke-width="2">
      <circle cx="36" cy="32.67" r="3.5"/>
      <circle cx="110.5" cy="41.33" r="3.5"/>
      <circle cx="185" cy="36.67" r="3.5"/>
      <circle cx="259.5" cy="44.33" r="3.5"/>
      <circle cx="334" cy="40" r="3.5"/>
    </g>

    <!-- 数值 -->
    <g font-size="9.5" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">
      <text x="36" y="18.67">9.4</text>
      <text x="110.5" y="27.33">6.8</text>
      <text x="185" y="22.67">8.2</text>
      <text x="259.5" y="30.33">5.9</text>
      <text x="334" y="26">7.2</text>
    </g>

    <!-- 日期 -->
    <g font-size="9" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle">
      <text x="36" y="78">10-19</text>
      <text x="110.5" y="78">10-20</text>
      <text x="185" y="78">10-21</text>
      <text x="259.5" y="78">10-22</text>
      <text x="334" y="78">10-23</text>
    </g>
  </g>
</svg>

